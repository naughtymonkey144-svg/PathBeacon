name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Unzip Project Source
      run: |
        mkdir -p extracted_project
        unzip -q pathbeacon.zip -d extracted_project
        find extracted_project -maxdepth 4

    - name: Build APK with Gradle KTS
      run: |
        cd extracted_project
        PROJECT_DIR=$(find . -name "build.gradle.kts" -maxdepth 4 | head -n 1 | xargs dirname)
        echo "Found Kotlin Gradle project in: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: app-debug
        path: |
          extracted_project/*/build/outputs/apk/debug/.apk
