name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Unzip Project Source
      run: |
        mkdir -p extracted_project
        unzip -q pathbeacon.zip -d extracted_project
        echo "Listing extracted files:"
        ls -la extracted_project

    - name: Build with Gradle
      run: |
        cd extracted_project
        # Find the directory that contains gradlew
        GRADLEW_DIR=$(find . -name "gradlew" -maxdepth 4 | xargs dirname)
        if [ -z "$GRADLEW_DIR" ]; then
          echo "gradlew not found, looking for build.gradle..."
          BUILD_GRADLE_DIR=$(find . -name "build.gradle" -maxdepth 4 | xargs dirname)
          cd "$BUILD_GRADLE_DIR"
          gradle assembleDebug
        else
          echo "Found gradlew in: $GRADLEW_DIR"
          cd "$GRADLEW_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          extracted_project/**/build/outputs/apk/debug/app-debug.apk
