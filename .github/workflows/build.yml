name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Unzip Project Source
      run: |
        mkdir -p extracted_project
        unzip -q pathbeacon.zip -d extracted_project
        ls -R extracted_project

    - name: Find and Build with Gradle
      run: |
        cd extracted_project
        # Find directory containing build.gradle
        PROJECT_DIR=$(find . -name "build.gradle" -maxdepth 3 | xargs dirname)
        echo "Found project directory: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        chmod +x gradlew || true
        if [ -f "gradlew" ]; then
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          extracted_project/**/build/outputs/apk/debug/app-debug.apk
