name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Unzip Project Source
      run: |
        mkdir -p extracted_project
        unzip -q pathbeacon.zip -d extracted_project

    - name: Generate Debug Keystore Safely
      run: |
        keytool -genkeypair -v -keystore extracted_project/debug.keystore \
          -storepass android -alias androiddebugkey -keypass android \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"
        for d in $(find extracted_project -name "build.gradle.kts" -maxdepth 5 -exec dirname {} \;); do
          cp -f extracted_project/debug.keystore "$d/debug.keystore"
          if [ -d "$d/app" ]; then
            cp -f extracted_project/debug.keystore "$d/app/debug.keystore"
          fi
        done
        find extracted_project -path "/res/" -name "debug.keystore" -delete

    - name: Build APK with Gradle KTS
      run: |
        cd extracted_project
        PROJECT_DIR=$(find . -name "build.gradle.kts" -maxdepth 4 | head -n 1 | xargs dirname)
        cd "$PROJECT_DIR"
        gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: app-debug
        path: |
          extracted_project/*/build/outputs/apk/debug/.apk
